count">0</span>)</a><a href="conta.html" data-account-link>Conta</a><a href="chat.html" data-chat-link>Chat</a><a href="admin.html" data-admin-link style="display:none">Admin</a></div></div></div></nav>
<main class="app-wrap">
  <h1 class="gradient-text" style="font-size:clamp(36px,5vw,56px);font-weight:700;text-align:center;margin:0">Cardápio</h1>
  <p style="text-align:center">Hambúrgueres na brasa, com ingredientes frescos. Escolhe, adiciona e paga por M-Pesa.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0">
    <button class="btn-outline filter-btn" data-filter="" type="button">Todos</button>
    <button class="btn-outline filter-btn" data-filter="Hambúrgueres da Brasa" type="button">Hambúrgueres da Brasa</button>
    <button class="btn-outline filter-btn" data-filter="Cachorros" type="button">Cachorros</button>
    <button class="btn-outline filter-btn" data-filter="Tacos" type="button">Tacos</button>
  </div>
  <div id="cardapio-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px"></div>
</main>
<footer class="bg-card border-t border-border py-12"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center"><span class="logo-badge"><img src="images/brasa-logo.png" alt="BRASA Logo" class="site-logo h-16 w-auto"></span><p class="text-muted-foreground">Hamburgaria · Maputo</p><p class="text-muted-foreground">© 2026 BRASA. Todos os direitos reservados. | Maputo</p></div></footer>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var grid = document.getElementById("cardapio-grid");
  function render(filter){
    var list = filter ? PRODUCTS.filter(function(p){ return p.category === filter; }) : PRODUCTS;
    grid.innerHTML = list.map(function(p){
      return '<div class="app-card" style="padding:0;overflow:hidden"><img src="' + p.image_url + '" alt="' + p.name + '" style="width:100%;height:220px;object-fit:cover;display:block"><div style="padding:20px"><p style="margin:0 0 6px">' + p.category + '</p><h3 style="color:#fff;font-size:22px;font-weight:400;margin:0">' + p.name + '</h3><p>' + p.description + '</p><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px"><span style="background:linear-gradient(135deg,#e0311a,#000);color:#fff;padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap">' + fmtMT(p.price_mt) + '</span><button type="button" data-add="' + p.id + '" class="gradient-bg px-5 py-2 rounded-full text-white font-bold text-sm">Adicionar</button></div></div></div>';
    }).join("");
    window.brasa.bindAddButtons();
  }
  render("");
  document.querySelectorAll(".filter-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ render(btn.getAttribute("data-filter")); });
  });
});
</script>
<script>document.querySelector('[data-testid="button-mobile-menu"]').addEventListener('click',function(){var m=document.getElementById('mobile-menu');if(m)m.classList.toggle('hidden');});document.querySelectorAll('#mobile-menu a').forEach(function(a){a.addEventListener('click',function(){document.getElementById('mobile-menu').classList.add('hidden');});});</script>
